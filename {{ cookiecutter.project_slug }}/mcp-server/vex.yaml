---
advisories:
  - vulnerability: CVE-2025-15367
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The poplib module is included in the Python standard library, but this service does not use it or process POP3 protocol operations.
    products:
      - pkg:apk/alpine/python3@3.14.8-r0
  - vulnerability: CVE-2026-87910
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The tarfile module is included in the Python standard library but this service does not use it or perform any kind of archive extraction.
    products:
      - pkg:apk/alpine/python3@3.14.8-r0
  - vulnerability: CVE-2026-12345
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The tempfile module is included in the Python standard library, but this service and its dependencies do not use tempfile.TemporaryDirectory or invoke its cleanup functionality.
    products:
      - pkg:apk/alpine/python3@3.14.8-r0
 
  - vulnerability: CVE-2025-60876
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The BusyBox wget applet is included in the Alpine operating system, but this service does not use it.
    products:
      - pkg:apk/alpine/busybox@1.37.0-r31
      - pkg:apk/alpine/busybox-binsh@1.37.0-r31
      - pkg:apk/alpine/ssl_client@1.37.0-r31

  - vulnerability: GHSA-g6cj-pr64-35w5
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The cryptography package is installed, but this service does not call the pkcs7_decrypt_der(), pkcs7_decrypt_pem(), or pkcs7_decrypt_smime() functions or decrypt user-supplied PKCS#7 EnvelopedData.
    products:
      - pkg:pypi/cryptography@49.0.0

  - vulnerability: CVE-2026-85091
    status: not_affected
    justification: vulnerable_code_not_in_execute_path
    impact_statement: The zlib gz_vacate() overflow is only reachable via gzprintf() or gzvprintf() calls on a non-blocking gzwrite() handle. This service does not call these functions, does not vendor or statically link zlib, and does not access libz through ctypes/cffi. 
    products:
      - pkg:apk/alpine/zlib@1.3.2-r0
